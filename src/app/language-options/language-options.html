<div class="p-3">
    <div class="d-flex justify-content-between align-items-center">
        <button class="btn btn-warning" (click)="back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>


    <div class="d-flex justify-content-center align-items-center" style="height: calc(100vh - 200px);">
        <div class="d-flex flex-column gap-2 w-100" style="max-width: 400px;">
            <button class="btn btn-dark w-100" (click)="goToLearnLanguage()">Ucz się</button>
            <button class="btn btn-dark w-100" (click)="goToAddWords()">Dodaj słówka</button>
            <button class="btn btn-dark w-100" (click)="goToSummary()">Podsumowanie</button>
        </div>
    </div>
</div>
