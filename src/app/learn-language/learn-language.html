<div class="p-3">
  <div class="d-flex justify-content-between align-items-center">
    <button class="btn btn-warning" (click)="back()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <span class="fw-bold">{{ language }} – Powtarzanie</span>
  </div>

  <!-- BRAK SŁÓW -->
  <div *ngIf="!currentWord" class="d-flex justify-content-center align-items-center"
    style="height: calc(100vh - 200px);">
    <p class="fs-4 text-muted text-center">Brak słów do nauki 🎉</p>
  </div>

  <!-- NAUKA -->
  <div *ngIf="currentWord" class="d-flex justify-content-center align-items-center"
    style="height: calc(100vh - 200px);">
    <div class="d-flex flex-column gap-2 w-100" style="max-width: 400px;">
      <p class="fs-4 mb-3 text-center">
        {{ showSourceToTarget ? currentWord.source : currentWord.target }}
      </p>

      <input type="text" class="form-control mb-3" placeholder="Wpisz odpowiedź..." [(ngModel)]="answer"
        [disabled]="answered" />

      <button class="btn btn-dark" (click)="checkAnswer()" [disabled]="answer.trim() === '' || answered">
        Zatwierdź
      </button>

      <div *ngIf="answered" class="mt-3 fs-5 text-center">
        <span *ngIf="correct" class="text-success d-block">Dobrze!</span>
        <span *ngIf="!correct" class="text-danger d-block">Źle!</span>
      </div>

      <p *ngIf="answered" class="text-muted mb-0">Poprawna odpowiedź:</p>
      <p *ngIf="answered"><strong>{{ correctAnswer }}</strong></p>

      <button *ngIf="answered" class="btn btn-primary mt-2" (click)="nextWord()">
        Następne słówko
      </button>
    </div>
  </div>
</div>
